<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Tetris</title>
  <meta name="description" content="Claude Tetris: el clásico Tetris en JavaScript vanilla con HTML5 Canvas. Sin dependencias, solo abrir y jugar." />
  <meta property="og:title" content="Claude Tetris" />
  <meta property="og:description" content="El clásico Tetris en JavaScript vanilla con HTML5 Canvas. Sin dependencias, solo abrir y jugar." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0f17'/%3E%3Crect x='4' y='4' width='11' height='11' fill='%234dd0e1'/%3E%3Crect x='17' y='4' width='11' height='11' fill='%23ffd54f'/%3E%3Crect x='4' y='17' width='11' height='11' fill='%23ba68c8'/%3E%3Crect x='17' y='17' width='11' height='11' fill='%23e57373'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="game-title" aria-label="Claude Tetris">
    <span>C</span><span>L</span><span>A</span><span>U</span><span>D</span><span>E</span>
    <span class="gap"></span>
    <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
